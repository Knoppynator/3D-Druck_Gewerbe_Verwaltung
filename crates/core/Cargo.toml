[package]
name = "druckplaner-core"
version = "0.1.0"
edition = "2021"

[dependencies]
roxmltree = "0.21"
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
typst-as-lib = { version = "0.17", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-pdf = "0.15"
